<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S.SPORT LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e17;color:#fff;font-family:Arial}
header{background:#121b2c;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00e676;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#0f1a2b;position:sticky;top:53px;z-index:9}.tab{padding:8px 16px;border-radius:20px;background:#1a2741;border:1px solid #22365e;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}.tab.on{background:#00e676;color:#000}
.match{background:#131f35;margin:10px 14px;border-radius:14px;border:1px solid #22365e;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:12px 14px;cursor:pointer}
.team{flex:1}.team b{font-size:15px}.meta{font-size:11px;color:#8aa;margin-top:3px}
.scoreBox{text-align:right}.score{font-size:20px;font-weight:900;background:#0a1426;padding:6px 12px;border-radius:8px;min-width:60px;text-align:center}
.liveDot{width:8px;height:8px;background:#ff2d2d;border-radius:50%;display:inline-block;animation:pulse 1s infinite;margin-right:4px}@keyframes pulse{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}
.details{display:none;padding:0 14px 14px;border-top:1px solid #1f3356;background:#0e1a2e;font-size:13px;line-height:1.6}.details.on{display:block}
.star{cursor:pointer;font-size:18px;margin-left:10px;color:#445}.star.fav{color:#ffcc00}
</style>
</head><body>
<header><b>S.SPORT</b><span style="background:#00e676;color:#000;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:900">● LIVE</span></header>
<div class="tabs"><div class="tab on" data-l="all">All</div><div class="tab" data-l="eng.1">Premier League</div><div class="tab" data-l="esp.1">La Liga</div><div class="tab" data-l="ita.1">Serie A</div><div class="tab" data-l="ger.1">Bundesliga</div><div class="tab" data-l="gha.1">GPL</div><div class="tab" data-l="uefa.champions">UCL</div></div>
<div style="text-align:center;padding:18px 16px"><h1 style="font-size:26px">World football. <span style="color:#00e676">Live now.</span></h1><p id="upd" style="color:#7a8ca8;font-size:12px;margin-top:6px">Connecting...</p></div>
<div id="games"></div>
<script>
const L={ "eng.1":"PREMIER LEAGUE","esp.1":"LA LIGA","ita.1":"SERIE A","ger.1":"BUNDESLIGA","gha.1":"GHANA PL","uefa.champions":"CHAMPIONS LEAGUE"};
let cur="all";
async function get(code){
 try{const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/scoreboard`);const j=await r.json();return j.events||[]}catch{return[]}
}
async function load(){
 const box=document.getElementById('games');box.innerHTML='<div style="text-align:center;padding:40px;color:#7a8ca8">Loading Flashscore data...</div>';
 let all=[];
 for(let c of Object.keys(L)){ if(cur!=="all"&&cur!==c)continue; const ev=await get(c); ev.forEach(e=>{e._l=c;all.push(e);});}
 if(!all.length){box.innerHTML='<div style="text-align:center;padding:50px;color:#7a8ca8">No matches live right now.<br>Peak times: 13:00-22:00 GMT<br><br>Last check: '+new Date().toLocaleTimeString()+'</div>';document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString();return;}
 let html='';let last='';
 all.forEach((e,i)=>{
  if(last!==e._l){html+=`<div style="margin:22px 14px 6px;color:#00e676;font-size:11px;letter-spacing:2px;font-weight:900">${L[e._l]}</div>`;last=e._l;}
  const comp=e.competitions[0];const h=comp.competitors.find(x=>x.homeAway==='home');const a=comp.competitors.find(x=>x.homeAway==='away');
  const st=comp.status;const live=st.type.state==='in';const clock=st.displayClock||st.type.shortDetail||'FT';
  html+=`<div class="match" onclick="this.querySelector('.details').classList.toggle('on')"><div class="top"><div class="team"><div style="font-size:11px;color:${live?'#ff4d4d':'#8aa'}">${live?'<span class=liveDot></span>':''}${clock} • ${st.type.shortDetail||''}</div><div style="margin-top:6px"><b>${h.team.shortDisplayName}</b></div><div style="margin-top:4px"><b>${a.team.shortDisplayName}</b></div><div class="meta">Tap to see details</div></div><div class="scoreBox"><div class="score">${live||st.type.completed?h.score+' - '+a.score:'vs'}</div><span class="star" onclick="event.stopPropagation();this.classList.toggle('fav')">★</span></div></div><div class="details"><b>Details:</b><br>Home: ${h.team.displayName}<br>Away: ${a.team.displayName}<br>Status: ${st.type.description}<br>Venue: ${comp.venue?.fullName||'TBD'}<br><br><span style="color:#00e676">Updates live every 60s like Flashscore</span></div></div>`;
 });
 box.innerHTML=html;document.getElementById('upd').textContent='LIVE • '+new Date().toLocaleTimeString()+' • Tap match = Flashscore style';
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');cur=t.dataset.l;load();});
load();setInterval(load,60000);
</script>
</body></html>
