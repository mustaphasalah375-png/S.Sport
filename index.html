<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S.SPORT</title><style>*{margin:0;box-sizing:border-box}body{font-family:Arial;background:#0b0e12;color:#fff}header{background:#12161e;padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #ff3c00;position:sticky;top:0}.logo{font-weight:900;color:#ff3c00;font-size:22px}nav span{margin-left:10px;color:#aaa;font-size:14px;font-weight:700}nav span.on{color:#fff;border-bottom:2px solid #ff3c00}.tab{display:none;padding:12px}.tab.on{display:block}.card{background:#161b26;border-radius:14px;padding:14px;margin:12px 0;border:1px solid #222}.live{color:#00ff88;font-weight:900;font-size:12px}.score{font-size:24px;font-weight:900;text-align:center;margin:10px}.btn{background:#ff3c00;color:#fff;border:0;width:100%;padding:14px;border-radius:10px;font-weight:900}#game{position:relative;width:100%;height:70vh;background:#000;border-radius:14px;overflow:hidden;border:2px solid #ff3c00}#game canvas{width:100%;height:100%}#hud{position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;font-size:12px;font-weight:900;z-index:5}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#ff3c00;font-size:22px}#joy{position:absolute;bottom:12px;left:12px;width:95px;height:95px;background:rgba(255,255,255,.12);border-radius:50%;border:2px solid #ff3c00}#stick{width:38px;height:38px;background:#ff3c00;border-radius:50%;position:absolute;left:28px;top:28px}#fire{position:absolute;bottom:15px;right:15px;width:80px;height:80px;background:#ff3c00;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900}</style></head><body><header><div class="logo">S.SPORT</div><nav><span id="t1" class="on" onclick="tab('scores')">SCORES</span><span id="t2" onclick="tab('redsec')">REDSEC</span></nav></header><div id="scores" class="tab on"><div class="card"><span class="live">● LIVE 78'</span><div class="score">Hearts 1 - 1 Kotoko</div></div><div class="card"><span class="live" style="color:#ff3c00">● LIVE 62'</span><div class="score">Medeama 2 - 0 Dreams</div></div><div class="card"><div style="color:#888;font-size:12px">FT</div><div class="score">Gold Stars 0 - 1 Samartex</div></div><div class="card" style="border-color:#ff3c00"><h3 style="color:#ff3c00">🔥 REDSEC BATTLE ROYALE</h3><p style="color:#aaa;font-size:13px;margin:6px 0">Ghana Free Fire - Last man standing!</p><button class="btn" onclick="tab('redsec')">PLAY NOW</button></div></div><div id="redsec" class="tab"><div id="game"><div id="hud"><span>HP:<b id="hp">100</b> AMMO:<b id="am">30</b></span><span>KILLS:<b id="k">0</b> ALIVE:<b id="al">12</b></span></div><div id="cross">+</div><canvas id="c"></canvas><div id="joy"><div id="stick"></div></div><button id="fire">FIRE</button></div></div><script>function tab(n){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));document.getElementById(n).classList.add('on');document.getElementById('t1').classList.toggle('on',n=='scores');document.getElementById('t2').classList.toggle('on',n=='redsec');if(n=='redsec'&&!window.started)start();}window.started=false;function start(){window.started=true;const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H;function rs(){W=canvas.width=canvas.offsetWidth*2;H=canvas.height=canvas.offsetHeight*2}rs();let x=0,y=0,yaw=0,hp=100,ammo=30,kills=0,enemies=[];for(let i=0;i<12;i++)enemies.push({x:(Math.random()-0.5)*1400,y:(Math.random()-0.5)*1400,hp:100,alive:true,t:0});let jx=0,jy=0;const joy=document.getElementById('joy'),stick=document.getElementById('stick');joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-(r.left+47),dy=t.clientY-(r.top+47),d=Math.hypot(dx,dy);if(d>32){dx=dx/d*32;dy=dy/d*32}stick.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/32;jy=dy/32;e.preventDefault()},{passive:false});joy.addEventListener('touchend',()=>{stick.style.transform='translate(0,0)';jx=0;jy=0});function shoot(){if(ammo<=0)return;ammo--;enemies.forEach(en=>{if(!en.alive)return;let dx=en.x-x,dy=en.y-y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-yaw,na=Math.atan2(Math.sin(ang),Math.cos(ang));if(Math.abs(na)<0.35&&dist<750){en.hp-=70;if(en.hp<=0){en.alive=false;kills++;}}});}document.getElementById('fire').addEventListener('touchstart',shoot);let lastX=0;canvas.addEventListener('touchmove',e=>{let t=e.touches[0];if(lastX)yaw+=(t.clientX-lastX)*0.015;lastX=t.clientX;},{passive:false});canvas.addEventListener('touchend',()=>lastX=0);(function loop(){requestAnimationFrame(loop);x+=Math.cos(yaw)*jx*5+Math.sin(yaw)*jy*5;y+=Math.sin(yaw)*jx*5-Math.cos(yaw)*jy*5;ctx.fillStyle='#8db4e2';ctx.fillRect(0,0,W,H*0.55);ctx.fillStyle='#2f6b27';ctx.fillRect(0,H*0.55,W,H*0.45);enemies.forEach(en=>{if(!en.alive)return;let dx=en.x-x,dy=en.y-y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-yaw,na=Math.atan2(Math.sin(ang),Math.cos(ang));if(Math.abs(na)<1.1&&dist<1100){let sc=550/(dist+90),sx=W/2+Math.tan(na)*W*0.7,sy=H*0.55+20;ctx.fillStyle='#b00';ctx.fillRect(sx-sc*18,sy-sc*50,sc*36,sc*55);ctx.fillStyle='#ff0';ctx.fillRect(sx-sc*10,sy-sc*70,sc*20,sc*20);en.t++;if(dist<550&&en.t>75){hp-=7;en.t=0;}}let ad=Math.atan2(y-en.y,x-en.x);en.x+=Math.cos(ad)*1;en.y+=Math.sin(ad)*1;});ctx.fillStyle='#222';ctx.fillRect(W/2-70,H*0.82,140,28);ctx.fillStyle='#ff3c00';ctx.fillRect(W/2-60,H*0.84,120,8);document.getElementById('hp').innerText=Math.max(0,Math.floor(hp));document.getElementById('am').innerText=ammo;document.getElementById('k').innerText=kills;document.getElementById('al').innerText=enemies.filter(e=>e.alive).length;if(hp<=0){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 44px Arial';ctx.textAlign='center';ctx.fillText('YOU DIED',W/2,H/2)}if(kills>=12){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff3c00';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText('CHICKEN DINNER!',W/2,H/2)}})();setInterval(()=>{if(ammo<30)ammo++},900);}</script></body></html>
