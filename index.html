<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>S.SPORT — Live Football</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span><span>S.SPORT</span></div>
    <nav>
      <a class="active" href="#home">Home</a>
      <a href="#matches">Matches</a>
      <a href="#standings">Standings</a>
    </nav>
    <button class="menu" aria-label="Menu">☰</button>
  </header>

  <main id="home">
    <section class="hero">
      <div>
        <p class="eyebrow">LIVE FOOTBALL</p>
        <h1>Every match.<br><span>One place.</span></h1>
        <p class="hero-copy">Follow live scores, fixtures, results and standings with S.SPORT.</p>
        <a class="cta" href="#matches">View matches →</a>
      </div>
      <div class="hero-ball">⚽</div>
    </section>

    <section class="section" id="matches">
      <div class="section-head">
        <div><p class="eyebrow">TODAY</p><h2>Live & upcoming</h2></div>
        <span class="live-pill"><i></i> LIVE</span>
      </div>
      <div id="matchesGrid" class="matches"></div>
    </section>

    <section class="section" id="standings">
      <div class="section-head"><div><p class="eyebrow">LEAGUE</p><h2>Premier League</h2></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Club</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>© 2026 S.SPORT · Live football made simple.</footer>
  <script src="app.js"></script>
</body>
</html>
