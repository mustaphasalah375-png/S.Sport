<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S.SPORT</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00e676">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e17;color:#fff;font-family:Arial}
header{background:#121b2c;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00e676;position:sticky;top:0;z-index:20}
.tabs{display:flex;gap:6px;overflow:auto;padding:10px;background:#0f1a2b;position:sticky;top:53px;z-index:19}.tab{padding:8px 14px;border-radius:20px;background:#1a2741;border:1px solid #22365e;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.on{background:#00e676;color:#000}
.filters{display:flex;gap:8px;padding:10px 14px}.f{padding:6px 14px;border-radius:20px;background:#1c2d4f;font-size:12px;cursor:pointer;border:1px solid #2a3f66}.f.on{background:#fff;color:#000}
.match{background:#131f35;margin:8px 12px;border-radius:12px;border:1px solid #22365e;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:12px;cursor:pointer}
.team b{font-size:14px}.score{font-size:18px;font-weight:900;background:#0a1426;padding:5px 10px;border-radius:8px}
.det{display:none;padding:12px;border-top:1px solid #1f3356;background:#0e1a2e;font-size:13px}.det.on{display:block}
.liveDot{width:7px;height:7px;background:#ff2d2d;border-radius:50%;display:inline-block;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
.league{margin:18px 12px 4px;color:#00e676;font-size:11px;letter-spacing:2px;font-weight:900}
</style></head><body>
<header><b>S.SPORT</b><span style="background:#00e676;color:#000;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900">● LIVE + HISTORY</span></header>
<div class="tabs"><div class="tab on" data-l="all">All</div><div class="tab" data-l="eng.1">EPL</div><div class="tab" data-l="esp.1">La Liga</div><div class="tab" data-l="ita.1">Serie A</div><div class="tab" data-l="ger.1">Bundes</div><div class="tab" data-l="gha.1">GPL</div><div class="tab" data-l="uefa.champions">UCL</div></div>
<div class="filters"><div class="f on" data-s="all">All</div><div class="f" data-s="live">LIVE</div><div class="f" data-s="finished">Results</div><div class="f" data-s="upcoming">Upcoming</div></div>
<div style="text-align:center;padding:10px;color:#7a8ca8;font-size:11px" id="upd">Loading full football database...</div>
<div id="games"></div>
<script>
const LEAGUES={"eng.1":"PREMIER LEAGUE","esp.1":"LA LIGA","ita.1":"SERIE A","ger.1":"BUNDESLIGA","gha.1":"GHANA PREMIER LEAGUE","uefa.champions":"CHAMPIONS LEAGUE"};
let curLeague="all", curStatus="all", store=[];
async function fetchLeague(c){
 try{const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${c}/scoreboard`);const j=await r.json();return (j.events||[]).map(e=>{e._lg=c;return e;})}catch{return[]}
}
async function load(){
 const box=document.getElementById('games');box.innerHTML='<div style="padding:40px;text-align:center;color:#7a8ca8">Loading live, old & upcoming...</div>';
 let all=[];for(let k of Object.keys(LEAGUES)){if(curLeague!=="all"&&curLeague!==k)continue;all.push(...await fetchLeague(k));}
 store=all;render();
}
function render(){
 const box=document.getElementById('games');let html='',last='';
 let filtered=store.filter(e=>{
  const s=e.competitions[0].status.type.state;
  if(curStatus==="live")return s==="in";
  if(curStatus==="finished")return s==="post";
  if(curStatus==="upcoming")return s==="pre";
  return true;
 });
 if(!filtered.length){box.innerHTML='<div style="padding:50px;text-align:center;color:#7a8ca8">No '+curStatus+' matches.<br>Try All</div>';return;}
 filtered.sort((a,b)=>{return a.competitions[0].status.type.state==="in"?-1:0});
 filtered.forEach(e=>{
  if(last!==e._lg){html+=`<div class="league">${LEAGUES[e._lg]}</div>`;last=e._lg;}
  const c=e.competitions[0],h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away'),st=c.status;
  const isLive=st.type.state==="in", isPost=st.type.state==="post";
  html+=`<div class="match" onclick="openDetails('${e.id}','${e._lg}',this)">
   <div class="top"><div><div style="font-size:10px;color:${isLive?'#ff4d4d':'#8aa'}">${isLive?'<span class=liveDot></span>':''}${st.type.shortDetail}</div>
   <div style="margin-top:5px"><b>${h.team.displayName}</b> ${isLive||isPost?`<span style="float:right;background:#0a1426;padding:2px 8px;border-radius:6px">${h.score}</span>`:''}</div>
   <div style="margin-top:3px"><b>${a.team.displayName}</b> ${isLive||isPost?`<span style="float:right;background:#0a1426;padding:2px 8px;border-radius:6px">${a.score}</span>`:''}</div></div>
   <div class="score">${isLive||isPost?h.score+'-'+a.score:st.type.shortDetail}<br><span style="font-size:10px;color:#8aa">Tap →</span></div></div>
   <div class="det">Loading team & player info...</div></div>`;
 });
 box.innerHTML=html;document.getElementById('upd').textContent=`${filtered.length} matches • ${curStatus.toUpperCase()} • Tap any match for team/player info • ${new Date().toLocaleTimeString()}`;
}
async function openDetails(id, lg, el){
 const det=el.querySelector('.det');det.classList.toggle('on');if(!det.classList.contains('on'))return;
 try{
  const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/summary?event=${id}`);const j=await r.json();
  let info=`<b>${j.header?.competitions[0]?.venue?.fullName||''}</b><br>${j.header?.competitions[0]?.date||''}<br><br>`;
  if(j.boxscore?.teams){info+='<b>TEAM LINEUPS & STATS</b><br>';j.boxscore.teams.forEach(t=>{info+=`${t.team.displayName}: ${t.statistics?.length||0} stats<br>`;});}
  if(j.rosters){info+='<br><b>PLAYERS</b><br>';j.rosters.forEach(r=>{info+=`${r.team.displayName}: ${r.roster?.length||0} players<br>`;});}
  if(j.commentary)info+=`<br><b>Last action:</b> ${j.commentary[0]?.text||'No commentary yet'}<br>`;
  info+=`<br><span style="color:#00e676">Data from ESPN FC • Full team & player info</span>`;
  det.innerHTML=info;
 }catch{det.innerHTML='Team info loading failed — try again. ESPN has full details for EPL, La Liga, UCL.';}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');curLeague=t.dataset.l;load();});
document.querySelectorAll('.f').forEach(f=>f.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));f.classList.add('on');curStatus=f.dataset.s;render();});
load();setInterval(load,120000);
</script></body></html>
